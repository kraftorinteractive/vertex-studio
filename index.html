<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vertex</title>
  </head>
  <body>
    <script>
      window.addEventListener('error', function(e) {
        document.body.innerHTML += '<div style="color: red; position: fixed; top: 0; left: 0; z-index: 99999; background: white; padding: 20px; font-size: 16px;">' + e.message + '<br/><pre>' + e.error.stack + '</pre></div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.body.innerHTML += '<div style="color: red; position: fixed; top: 0; left: 0; z-index: 99999; background: white; padding: 20px; font-size: 16px;">Unhandled Rejection: ' + e.reason + '</div>';
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
